<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>LunchRun</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap">
  <style>
    :root {
      --ground: #F6F4EF; --surface: #FFFFFF; --ink: #1B1A17; --muted: #57534C; --body: #3F3C36;
      --line: #D9D4CA; --line-soft: #E6E2D9; --field: #79736A;
      --accent: #1E5B45; --accent-dark: #123B2C; --accent-tint: #E3EFE9;
      --warn: #8A4B00; --warn-dark: #5C3200; --warn-tint: #FBEBD3;
      --error: #9A2B12; --disabled: #EFECE5; --focus: #1F5FBF;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.4 Figtree, system-ui, sans-serif; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: progress; opacity: 0.7; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .app { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
    .brand { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    .brand span { color: var(--accent); }
    .sub { font-size: 14px; color: var(--muted); }
    .who { display: flex; flex-direction: column; align-items: flex-end; font-size: 13px; color: var(--muted); }
    .who strong { color: var(--ink); font-size: 14px; }
    .link-btn { min-height: 44px; padding: 0 4px; border: 0; background: none; color: var(--accent); font-weight: 700; text-decoration: underline; }

    nav { display: flex; border-bottom: 1px solid var(--line); background: var(--surface); }
    nav button { flex: 1; min-height: 52px; border: 0; border-bottom: 4px solid transparent; background: none; font-size: 15px; font-weight: 600; color: var(--muted); }
    nav button[aria-current="page"] { border-bottom-color: var(--ink); color: var(--ink); font-weight: 800; }

    main { flex: 1; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 16px; }
    h1 { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
    h2 { margin: 0; font-size: 17px; font-weight: 800; }
    p { margin: 0; }
    .lead { font-size: 15px; color: var(--body); }
    .eyebrow { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }

    .banner { display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 2px solid; border-radius: 14px; font-size: 15px; }
    .banner svg { flex: none; }
    .banner.open { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-dark); }
    .banner.closed { background: var(--warn-tint); border-color: var(--warn); color: var(--warn-dark); }
    .banner.error { background: #FBE4DE; border-color: var(--error); color: #6E1E0C; }
    .banner.ok { background: var(--accent-tint); border-color: var(--accent); color: var(--accent-dark); }
    .big { display: block; font-size: 20px; font-weight: 800; color: var(--ink); }

    fieldset { margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 10px; }
    legend { padding: 0; margin-bottom: 10px; font-size: 20px; font-weight: 800; }
    .item { min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; }
    .item input { width: 24px; height: 24px; margin: 0; flex: none; accent-color: var(--accent); }
    .item .text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
    .item .name, .item .price { font-size: 17px; font-weight: 700; }
    .item.selected { border-color: var(--accent); background: var(--accent-tint); }
    .item.off { background: var(--disabled); cursor: not-allowed; }
    .item.off .name { text-decoration: line-through; color: var(--muted); }
    .item.off .price { color: var(--muted); }
    .tag { display: flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 700; }
    .tag.sel { color: var(--accent); }
    .tag.na { color: var(--muted); font-weight: 600; }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 16px; font-weight: 700; }
    .hint { font-size: 14px; color: var(--muted); }
    .field-error { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--error); }
    input[type=text], input[type=password], textarea { min-height: 48px; padding: 10px 12px; border: 2px solid var(--field); border-radius: 10px; background: var(--surface); font-size: 16px; width: 100%; }
    input[aria-invalid="true"] { border-color: var(--error); }
    textarea { min-height: 88px; resize: vertical; }
    .check { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 10px; font-weight: 600; cursor: pointer; }
    .check input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--accent); }

    .bar { position: sticky; bottom: 0; display: flex; flex-direction: column; gap: 8px; margin: 0 -20px -32px; padding: 12px 20px 20px; background: var(--surface); border-top: 1px solid var(--line); }
    .row { display: flex; justify-content: space-between; gap: 12px; }
    .btn { min-height: 56px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: #FFFFFF; font-size: 18px; font-weight: 700; }
    .btn.secondary { min-height: 52px; border: 2px solid var(--accent); background: var(--surface); color: var(--accent); font-size: 17px; }
    .btn.plain { min-height: 52px; border: 2px solid var(--ink); background: var(--surface); color: var(--ink); font-size: 17px; }

    .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
    .card > * { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); }
    .card > *:last-child { border-bottom: 0; }
    .card .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    .muted-note { color: var(--muted); font-style: italic; }
    .total { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--ink); color: #FFFFFF; border-radius: 14px; }
    .total .label { font-size: 18px; font-weight: 800; }
    .total .sum { font-size: 24px; font-weight: 800; }
    .total .sub { color: #D6D2C8; }

    .people { display: flex; flex-direction: column; gap: 10px; }
    .people button { min-height: 56px; padding: 0 16px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 17px; font-weight: 700; text-align: left; }
    .circle { display: flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 50%; }
    .badge { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; border: 1.5px solid; font-size: 13px; font-weight: 700; }
    .badge.on { border-color: var(--accent); background: var(--accent-tint); color: var(--accent-dark); }
    .badge.off { border-color: var(--muted); background: var(--disabled); color: var(--body); }
    .price-input { max-width: 140px; }
  </style>
</head>
<body>
  <div class="app" id="app"><main><p class="lead">Loading…</p></main></div>

<script>
var ICONS = {
  check: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  clock: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  lock: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  na: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>',
  alert: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>',
  bag: '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>'
};
var NAME_KEY = 'lunchrun.name';

var S = null;          // state from the server
var me = null;         // chosen name
var tab = 'order';     // order | orders | menu
var selected = null, note = '', changing = false;
var pin = '', mItems = null, mErrors = {}, mTried = false;
var busy = false, error = '', flash = '', deadline = 0, loadFailed = false;

try { me = localStorage.getItem(NAME_KEY); } catch (e) {}

// ---------- helpers
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(n) {
  try { return new Intl.NumberFormat(S.locale, { style: 'currency', currency: S.currency }).format(n); }
  catch (e) { return n.toFixed(2); }
}
function minutesLeft() { return Math.max(0, Math.ceil((deadline - Date.now()) / 60000)); }
function isOpen() { return S.isOpen && Date.now() < deadline; }
function myOrder() { return S.orders.filter(function (o) { return o.name === me; })[0] || null; }
function itemById(id) { return S.menu.filter(function (i) { return i.id === id; })[0] || null; }
function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }

function call(fn, args, onOk) {
  busy = true; error = ''; flash = ''; render();
  var runner = google.script.run
    .withSuccessHandler(function (res) { busy = false; loadFailed = false; if (onOk) onOk(res); render(); })
    .withFailureHandler(function (err) {
      busy = false;
      error = String((err && err.message) || err).replace(/^(Exception|Error):\s*/, '');
      if (fn === 'getState' && !S) loadFailed = true;
      render();
    });
  runner[fn].apply(runner, args);
}
function setState(st) {
  S = st;
  deadline = Date.now() + st.secondsLeft * 1000;
  if (me && S.people.indexOf(me) < 0) me = null;
}
function load() { call('getState', [], setState); }

// ---------- views
function errorBox() {
  if (error) return '<div class="banner error" role="alert">' + ICONS.alert + '<span>' + esc(error) + '</span></div>';
  if (flash) return '<div class="banner ok" role="status">' + ICONS.check + '<span>' + esc(flash) + '</span></div>';
  return '';
}

function headerView() {
  var who = me
    ? '<div class="who"><span>Signed in as</span><strong>' + esc(me) + '</strong>' +
      '<button type="button" class="link-btn" data-action="switchPerson">Not you?</button></div>'
    : '';
  return '<header><div><div class="brand">Lunch<span>Run</span></div>' +
    '<div class="sub">' + esc(S.shop) + ' · ' + esc(S.dateLabel) + '</div></div>' + who + '</header>';
}

function navView() {
  var tabs = [['order', 'My lunch'], ['orders', "Today's orders"], ['menu', 'Edit menu']];
  return '<nav aria-label="Sections">' + tabs.map(function (t) {
    return '<button type="button" data-action="tab" data-tab="' + t[0] + '"' +
      (tab === t[0] ? ' aria-current="page"' : '') + '>' + t[1] + '</button>';
  }).join('') + '</nav>';
}

function pickerView() {
  return '<h1>Who are you?</h1>' +
    '<p class="lead">Choose your name. This phone will remember it.</p>' +
    '<div class="people">' + S.people.map(function (p) {
      return '<button type="button" data-action="pickPerson" data-name="' + esc(p) + '">' + esc(p) + '</button>';
    }).join('') + '</div>' +
    '<p class="hint">Not on the list? Ask the office manager to add you to the People sheet.</p>';
}

function openBanner() {
  var runner = S.runner ? S.runner + ' is today’s runner.' : 'Nobody has signed up as runner yet.';
  return '<div class="banner open">' + ICONS.clock + '<div>' +
    '<span class="eyebrow">Open · cut-off ' + esc(S.cutoff) + '</span>' +
    '<span class="big" id="countdown">' + plural(minutesLeft(), 'minute') + ' left to order</span>' +
    '<span>' + esc(runner) + '</span></div></div>';
}

function menuView() {
  var sel = itemById(selected);
  if (sel && !sel.available) sel = null;
  var items = S.menu.map(function (i) {
    var checked = sel && sel.id === i.id;
    var cls = 'item' + (checked ? ' selected' : '') + (i.available ? '' : ' off');
    return '<label class="' + cls + '">' +
      '<input type="radio" name="item" id="item-' + esc(i.id) + '" value="' + esc(i.id) + '"' +
      (checked ? ' checked' : '') + (i.available ? '' : ' disabled') + '>' +
      '<span class="text"><span class="name">' + esc(i.name) + '</span>' +
      (i.available ? '' : '<span class="tag na">' + ICONS.na + 'Unavailable today</span>') +
      (checked ? '<span class="tag sel">' + ICONS.check + 'Selected</span>' : '') +
      '</span><span class="price">' + money(i.price) + '</span></label>';
  }).join('');
  return openBanner() +
    '<fieldset><legend>Today’s menu</legend>' + items + '</fieldset>' +
    '<div class="field"><label for="note">Note for the runner (optional)</label>' +
    '<span class="hint" id="note-hint">For example: no butter, brown bread, cut in half.</span>' +
    '<textarea id="note" aria-describedby="note-hint" maxlength="200" rows="3">' + esc(note) + '</textarea></div>' +
    '<div class="bar">' + errorBox() +
    '<div class="row lead"><span>' + (sel ? '1 × ' + esc(sel.name) : 'Nothing selected yet') + '</span>' +
    '<strong>' + money(sel ? sel.price : 0) + '</strong></div>' +
    '<button type="button" class="btn" data-action="place"' + (busy ? ' disabled' : '') + '>' +
    (busy ? 'Placing order…' : (changing ? 'Update order' : 'Place order')) + '</button>' +
    (changing ? '<button type="button" class="btn plain" data-action="cancelChange">Keep my current order</button>' : '') +
    '</div>';
}

function confirmedView(o) {
  var open = isOpen();
  return errorBox() +
    '<div style="display:flex;flex-direction:column;gap:10px">' +
    '<span class="circle" style="background:var(--accent);color:#fff">' + ICONS.check.replace(/18/g, '30') + '</span>' +
    '<h1>Order confirmed</h1>' +
    '<p class="lead">' + (S.runner ? esc(S.runner) + ' will collect it with everyone else’s order.'
      : 'It will be collected with everyone else’s order once someone signs up as runner.') + '</p></div>' +
    '<div class="card"><div class="eyebrow" style="color:var(--muted)">Your order</div>' +
    '<div class="row"><strong style="font-size:17px">' + esc(o.item) + '</strong><strong style="font-size:17px">' + money(o.price) + '</strong></div>' +
    '<div><div class="hint" style="font-weight:600">Note for the runner</div>' +
    (o.note ? '<div>' + esc(o.note) + '</div>' : '<div class="muted-note">No note</div>') + '</div>' +
    '<div class="row" style="font-size:18px;font-weight:800"><span>Total to pay ' + esc(S.runner || 'the runner') + '</span><span>' + money(o.price) + '</span></div></div>' +
    (open
      ? '<p class="lead">You can change or cancel your order until ' + esc(S.cutoff) + '.</p>' +
        '<button type="button" class="btn secondary" data-action="change">Change order</button>' +
        '<button type="button" class="btn plain" data-action="cancelOrder"' + (busy ? ' disabled' : '') + '>Cancel my order</button>'
      : '<div class="banner closed">' + ICONS.lock + '<span><strong>Orders are closed.</strong> Your order is locked in and can no longer be changed.</span></div>');
}

function closedView() {
  return errorBox() +
    '<span class="circle" style="background:var(--warn-tint);border:2px solid var(--warn);color:var(--warn)">' + ICONS.lock + '</span>' +
    '<div><div class="eyebrow" style="color:var(--warn)">Closed since ' + esc(S.cutoff) + '</div>' +
    '<h1>Orders are closed for today</h1></div>' +
    '<p class="lead" style="font-size:17px">Orders close at ' + esc(S.cutoff) + ' so the runner can send one combined order to ' + esc(S.shop) + ' in time for lunch.</p>' +
    '<p class="lead" style="font-size:17px">You didn’t place an order today. If you still need lunch, ask ' +
    esc(S.runner || 'today’s runner') + ' before they leave. They may be able to add it at the counter.</p>';
}

function orderTab() {
  var o = myOrder();
  if (o && !(changing && isOpen())) return confirmedView(o);
  if (!isOpen()) return closedView();
  return menuView();
}

function ordersTab() {
  var open = isOpen();
  var runnerBox;
  if (!S.runner) {
    runnerBox = '<div class="card"><div><h2>Nobody is doing the run yet</h2>' +
      '<p class="lead">The runner collects everyone’s lunch and pays the shop.</p></div>' +
      '<div><button type="button" class="btn" style="width:100%" data-action="volunteer"' + (busy ? ' disabled' : '') + '>I’ll do the run today</button></div></div>';
  } else if (S.runner === me) {
    runnerBox = '<div class="card"><div><h2>You’re today’s runner</h2>' +
      '<p class="lead">Thanks! Collect the orders below and pay the shop.</p></div>' +
      '<div><button type="button" class="btn plain" style="width:100%" data-action="stepDown"' + (busy ? ' disabled' : '') + '>I can’t do it after all</button></div></div>';
  } else {
    runnerBox = '<div class="card"><div class="row"><span>Today’s runner</span><strong>' + esc(S.runner) + '</strong></div></div>';
  }

  var groups = [], byKey = {};
  S.menu.forEach(function (i) { byKey[i.id] = { name: i.name, orders: [] }; groups.push(byKey[i.id]); });
  S.orders.forEach(function (o) {
    if (!byKey[o.itemId]) { byKey[o.itemId] = { name: o.item, orders: [] }; groups.push(byKey[o.itemId]); }
    byKey[o.itemId].orders.push(o);
  });
  var total = 0;
  var list = groups.filter(function (g) { return g.orders.length; }).map(function (g) {
    var sub = g.orders.reduce(function (s, o) { return s + o.price; }, 0);
    total += sub;
    return '<section class="card"><div class="head"><h2>' + esc(g.name) + '</h2><strong>' + g.orders.length + ' ×</strong></div>' +
      g.orders.map(function (o) {
        return '<div class="row"><div><div style="font-weight:600">' + esc(o.name) + '</div>' +
          (o.note ? '<div class="hint" style="color:var(--ink)">Note: ' + esc(o.note) + '</div>' : '<div class="hint muted-note">Note: none</div>') +
          '</div><span style="font-weight:600">' + money(o.price) + '</span></div>';
      }).join('') +
      '<div class="row" style="font-weight:700;color:var(--body)"><span>Subtotal</span><span>' + money(sub) + '</span></div></section>';
  }).join('');

  return errorBox() +
    '<div><h1>Today’s orders</h1><p class="lead">' + plural(S.orders.length, 'order') + ' from ' + esc(S.shop) + '.</p></div>' +
    (open
      ? '<div class="banner open">' + ICONS.clock + '<span><strong>Still open · ' + plural(minutesLeft(), 'min') + ' left.</strong> This list may change until ' + esc(S.cutoff) + '.</span></div>'
      : '<div class="banner closed">' + ICONS.lock + '<span><strong>Closed · final list.</strong> Ready to send to the shop.</span></div>') +
    runnerBox +
    (list || '<p class="lead">No orders yet.</p>') +
    '<div class="total"><span style="display:flex;flex-direction:column"><span class="label">Total</span><span class="sub">' + plural(S.orders.length, 'order') + '</span></span><span class="sum">' + money(total) + '</span></div>' +
    '<button type="button" class="btn plain" data-action="refresh"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Refreshing…' : 'Refresh list') + '</button>';
}

function parsePrice(s) {
  var t = String(s).trim().replace(',', '.');
  return /^\d+(\.\d{1,2})?$/.test(t) ? Number(t) : null;
}

function menuTab() {
  if (!mItems) {
    return '<div><h1>Edit menu</h1><p class="lead">For the office manager. Enter the PIN to change names, prices and availability.</p></div>' +
      errorBox() +
      '<div class="field"><label for="pin">Manager PIN</label>' +
      '<input type="password" id="pin" inputmode="numeric" autocomplete="off" value="' + esc(pin) + '"></div>' +
      '<button type="button" class="btn" data-action="unlock"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Checking…' : 'Unlock') + '</button>';
  }
  var cards = mItems.map(function (it, idx) {
    var badPrice = mTried && parsePrice(it.price) === null;
    var badName = mTried && !String(it.name).trim();
    return '<div class="card"><div style="display:flex;flex-direction:column;gap:12px">' +
      '<div class="row" style="align-items:center"><span class="eyebrow" style="color:var(--muted)">Item ' + (idx + 1) + '</span>' +
      (it.available ? '<span class="badge on">' + ICONS.check.replace(/18/g, '14') + 'On the menu</span>'
                    : '<span class="badge off">' + ICONS.na.replace(/16/g, '14') + 'Unavailable</span>') + '</div>' +
      '<div class="field"><label for="name-' + idx + '">Name</label>' +
      '<input type="text" id="name-' + idx + '" data-idx="' + idx + '" data-field="name" value="' + esc(it.name) + '"' + (badName ? ' aria-invalid="true"' : '') + '>' +
      (badName ? '<span class="field-error">' + ICONS.alert.replace(/22/g, '16') + 'Enter a name</span>' : '') + '</div>' +
      '<div class="field"><label for="price-' + idx + '">Price</label>' +
      '<input type="text" class="price-input" id="price-' + idx + '" inputmode="decimal" data-idx="' + idx + '" data-field="price" value="' + esc(it.price) + '"' + (badPrice ? ' aria-invalid="true"' : '') + '>' +
      (badPrice ? '<span class="field-error">' + ICONS.alert.replace(/22/g, '16') + 'Enter a price like 4.50</span>' : '') + '</div>' +
      '<label class="check"><input type="checkbox" id="avail-' + idx + '" data-idx="' + idx + '" data-field="unavailable"' + (it.available ? '' : ' checked') + '>' +
      '<span>Mark as unavailable today</span></label></div></div>';
  }).join('');
  return '<div><h1>Edit menu</h1><p class="lead">Changes show on everyone’s menu after you save.</p></div>' +
    errorBox() + cards +
    '<button type="button" class="btn plain" data-action="addItem">Add an item</button>' +
    '<div class="bar"><button type="button" class="btn" data-action="saveMenu"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Saving…' : 'Save menu') + '</button>' +
    '<button type="button" class="btn plain" data-action="lock">Lock</button></div>';
}

function render(focusId) {
  var root = document.getElementById('app');
  if (!S) {
    root.innerHTML = '<main>' + (loadFailed
      ? errorBox() + '<button type="button" class="btn" data-action="refresh">Try again</button>'
      : '<p class="lead">Loading…</p>') + '</main>';
    return;
  }
  if (!me) { root.innerHTML = headerView() + '<main>' + errorBox() + pickerView() + '</main>'; return; }
  var body = tab === 'orders' ? ordersTab() : tab === 'menu' ? menuTab() : orderTab();
  root.innerHTML = headerView() + navView() + '<main>' + body + '</main>';
  if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); }
}

// ---------- actions
var actions = {
  pickPerson: function (d) {
    me = d.name; tab = 'order'; error = '';
    try { localStorage.setItem(NAME_KEY, me); } catch (e) {}
    render();
  },
  switchPerson: function () {
    me = null; selected = null; note = ''; changing = false; error = '';
    try { localStorage.removeItem(NAME_KEY); } catch (e) {}
    render();
  },
  tab: function (d) { tab = d.tab; error = ''; flash = ''; changing = false; render(); },
  place: function () {
    var sel = itemById(selected);
    if (!sel || !sel.available) { error = 'Choose an item before placing your order.'; render(); return; }
    call('placeOrder', [me, sel.id, note], function (st) { setState(st); changing = false; });
  },
  change: function () {
    var o = myOrder();
    changing = true; selected = o ? o.itemId : null; note = o ? o.note : ''; error = ''; render();
  },
  cancelChange: function () { changing = false; error = ''; render(); },
  cancelOrder: function () {
    call('cancelOrder', [me], function (st) { setState(st); selected = null; note = ''; flash = 'Your order was cancelled.'; });
  },
  volunteer: function () { call('volunteerAsRunner', [me], setState); },
  stepDown: function () { call('stepDownAsRunner', [me], setState); },
  refresh: function () { load(); },
  unlock: function () {
    if (!pin) { error = 'Enter the PIN.'; render('pin'); return; }
    call('getMenuForManager', [pin], function (items) { mItems = toEditable(items); mTried = false; });
  },
  addItem: function () {
    mItems.push({ id: '', name: '', price: '', available: true });
    render('name-' + (mItems.length - 1));
  },
  saveMenu: function () {
    mTried = true;
    var bad = mItems.some(function (it) { return !String(it.name).trim() || parsePrice(it.price) === null; });
    if (bad) { error = 'Some items need fixing before you can save.'; render(); return; }
    var payload = mItems.map(function (it) {
      return { id: it.id, name: String(it.name).trim(), price: parsePrice(it.price), available: it.available };
    });
    call('saveMenu', [pin, payload], function (st) { setState(st); mItems = toEditable(st.menu); mTried = false; flash = 'Menu saved.'; });
  },
  lock: function () { mItems = null; pin = ''; mTried = false; error = ''; render(); }
};

function toEditable(items) {
  return items.map(function (i) { return { id: i.id, name: i.name, price: i.price.toFixed(2), available: i.available }; });
}

document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-action]');
  if (!el || el.disabled || busy) return;
  actions[el.dataset.action](el.dataset);
});

document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.name === 'item') { selected = t.value; error = ''; render(t.id); }
  else if (t.dataset.field === 'unavailable') { mItems[+t.dataset.idx].available = !t.checked; render(t.id || null); }
});

document.addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'note') note = t.value;
  else if (t.id === 'pin') pin = t.value;
  else if (t.dataset.field === 'name' || t.dataset.field === 'price') mItems[+t.dataset.idx][t.dataset.field] = t.value;
});

document.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'pin') actions.unlock();
});

// Countdown and automatic switch to "closed" at the cut-off.
setInterval(function () {
  if (!S || busy) return;
  if (S.isOpen && Date.now() >= deadline) { load(); return; }
  var c = document.getElementById('countdown');
  if (c) c.textContent = plural(minutesLeft(), 'minute') + ' left to order';
}, 15000);

load();
</script>
</body>
</html>
