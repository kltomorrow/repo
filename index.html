<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello from The Forge</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f1ea;
      color: #222;
      transition: background-color 0.4s ease;
    }
    main {
      text-align: center;
      padding: 2.5rem 3rem;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2.5rem;
    }
    p {
      margin: 0.4rem 0;
      font-size: 1.2rem;
    }
    button {
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #c0392b;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      background: #a93226;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello from The Forge</h1>
    <p>Made by <strong id="name"></strong></p>
    <p>Today is <span id="date"></span></p>
    <button id="colour-button" type="button">Change background colour</button>
  </main>

  <script>
    // Change this to update the name shown on the page.
    const MY_NAME = "Kai Leisering";

    document.getElementById("name").textContent = MY_NAME;

    document.getElementById("date").textContent = new Date().toLocaleDateString(undefined, {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    const colours = ["#f4f1ea", "#ffd6a5", "#caffbf", "#9bf6ff", "#bdb2ff", "#ffc6ff", "#fdffb6", "#a0c4ff"];
    let current = 0;

    document.getElementById("colour-button").addEventListener("click", () => {
      current = (current + 1) % colours.length;
      document.body.style.backgroundColor = colours[current];
    });
  </script>
</body>
</html>
